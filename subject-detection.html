<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Detection</title>

<style>
body {
    margin: 0;
        background: #111;
            color: white;
                text-align: center;
                    font-family: Arial;
                    }

                    button {
                        margin: 15px;
                            padding: 12px 25px;
                                border: none;
                                    border-radius: 20px;
                                    }

                                    .camera {
                                        position: relative;
                                            width: 100%;
                                            }

                                            video {
                                                width: 100%;
                                                    transform: scaleX(-1);
                                                    }

                                                    canvas {
                                                        position: absolute;
                                                            left: 0;
                                                                top: 0;
                                                                    width: 100%;
                                                                        height: 100%;
                                                                            transform: scaleX(-1);
                                                                            }
                                                                            </style>
                                                                            </head>

                                                                            <body>

                                                                            <h3>HAND DETECTION</h3>

                                                                            <button id="start">START CAMERA</button>

                                                                            <p id="status">Tekan START</p>

                                                                            <div class="camera">
                                                                                <video id="video" autoplay playsinline></video>
                                                                                    <canvas id="canvas"></canvas>
                                                                                    </div>

                                                                                    <script type="module">

                                                                                    import {
                                                                                        HandLandmarker,
                                                                                            FilesetResolver
                                                                                            }
                                                                                            from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


                                                                                            const video = document.getElementById("video");
                                                                                            const canvas = document.getElementById("canvas");
                                                                                            const ctx = canvas.getContext("2d");
                                                                                            const status = document.getElementById("status");

                                                                                            let detector;


                                                                                            // ==========================
                                                                                            // START
                                                                                            // ==========================

                                                                                            document.getElementById("start").onclick = async function () {

                                                                                                try {

                                                                                                        status.innerText = "Memuat...";

                                                                                                                const vision =
                                                                                                                            await FilesetResolver.forVisionTasks(
                                                                                                                                            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
                                                                                                                                                        );


                                                                                                                                                                detector =
                                                                                                                                                                            await HandLandmarker.createFromOptions(
                                                                                                                                                                                            vision,
                                                                                                                                                                                                            {
                                                                                                                                                                                                                                baseOptions: {
                                                                                                                                                                                                                                                        modelAssetPath:
                                                                                                                                                                                                                                                                                "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
                                                                                                                                                                                                                                                                                                    },

                                                                                                                                                                                                                                                                                                                        runningMode: "VIDEO",

                                                                                                                                                                                                                                                                                                                                            numHands: 2
                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                        );


                                                                                                                                                                                                                                                                                                                                                                                const stream =
                                                                                                                                                                                                                                                                                                                                                                                            await navigator.mediaDevices.getUserMedia({
                                                                                                                                                                                                                                                                                                                                                                                                            video: {
                                                                                                                                                                                                                                                                                                                                                                                                                                width: 480,
                                                                                                                                                                                                                                                                                                                                                                                                                                                    height: 360
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        video.srcObject = stream;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                video.onloadeddata = function () {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            canvas.width = video.videoWidth;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        canvas.height = video.videoHeight;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    status.innerText = "Kamera aktif";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                detect();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } catch (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    console.log(error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            status.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Kamera tidak bisa dibuka";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // ==========================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // DETEKSI
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // ==========================

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function detect() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.clearRect(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        0,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                0,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        canvas.width,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                canvas.height
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const result =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                detector.detectForVideo(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            video,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        performance.now()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const hands = result.landmarks;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (hands.length === 2) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let points = [];


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Ambil jempol + telunjuk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                hands.forEach(hand => {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            points.push(hand[4]);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        points.push(hand[8]);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // ======================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // GAMBAR 4 TITIK
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // ======================

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                points.forEach(point => {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const x =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            point.x * canvas.width;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const y =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        point.y * canvas.height;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.beginPath();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.arc(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                x,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                y,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                7,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                0,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Math.PI * 2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.fillStyle = "#00ffff";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.fill();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // ======================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // KOTAK MENGIKUTI JARI
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // ======================

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const xs =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        points.map(p =>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        p.x * canvas.width
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const ys =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        points.map(p =>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        p.y * canvas.height
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const minX =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Math.min(...xs);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const maxX =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Math.max(...xs);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const minY =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Math.min(...ys);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const maxY =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Math.max(...ys);


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const padding = 20;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.strokeStyle =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "#00ffff";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.lineWidth = 3;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.strokeRect(

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            minX - padding,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        minY - padding,
